# dsh-peak-runner 的 bundle 补丁层：往插件树里插一行。
# 注意 patch 对 config 是整块替换（不是深合并），profile 层要覆盖就得把想保留的键全部重写。
- insert:
    - id: dsh-peak-runner
      name: dsh-peak-runner
      config:
        enabled: true
        provider: deepseek-account
        model: deepseek-flash
        reasoningEffort: "off"
        maxTokens: 2048
        timeoutMs: 45000
        leadMinutes: 10
        peakWindows:
          - start: 1
            end: 4
          - start: 6
            end: 10
